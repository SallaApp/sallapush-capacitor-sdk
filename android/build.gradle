buildscript {
    ext.kotlin_version = project.hasProperty('kotlin_version') ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
// The Android Gradle plugin 9 registers Kotlin itself; apply the Kotlin plugin only when nothing did.
if (project.extensions.findByName('kotlin') == null) {
    apply plugin: 'kotlin-android'
}

// Capacitor apps declare repositories per project, so the private SallaPush repository is added to every project of
// the app's build. The guard skips it when the app already declares it under the same name.
rootProject.allprojects {
    repositories {
        if (findByName("SallaPushGitHubPackages") == null) {
            exclusiveContent {
                forRepository {
                    maven {
                        url = uri("https://maven.pkg.github.com/SallaApp/sallapush-android-sdk")
                        name = "SallaPushGitHubPackages"
                        credentials {
                            username = providers.gradleProperty("gpr.user").getOrNull() ?: System.getenv("GITHUB_ACTOR")
                            password = providers.gradleProperty("gpr.key").getOrNull() ?: System.getenv("GITHUB_TOKEN")
                        }
                    }
                }
                filter { includeGroup("com.salla.push") }
            }
        }
    }
}

android {
    namespace = "sa.salla.sallapush.capacitor"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36

    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 24
        consumerProguardFiles "consumer-rules.pro"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    lint {
        abortOnError = true
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation project(':capacitor-android')
    api "com.salla.push:sallapush:1.0.3"

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.14.1"
    testImplementation "androidx.test:core:1.6.1"
}

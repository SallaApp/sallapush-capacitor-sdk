# SwiftLint 0.63.2, run from the repository root by scripts/verify.sh swiftlint: swiftlint lint --strict

included:
  - ios
  - example-app/ios/App

excluded:
  - example-app/ios/App/CapApp-SPM
  - example-app/ios/App/build
  - example-app/ios/DerivedData

opt_in_rules:
  - force_unwrapping
  - implicitly_unwrapped_optional

disabled_rules:
  - trailing_comma

force_cast: error
force_unwrapping: error
implicitly_unwrapped_optional: error

line_length:
  warning: 140
  error: 200

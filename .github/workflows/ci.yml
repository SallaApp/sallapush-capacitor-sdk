name: CI

# Every pull request and every push to master, on GitHub-hosted runners: the portable steps of scripts/verify.sh, the
# same ones a contributor runs locally. Native builds, native unit tests, the example smoke tests and the consumer
# installs run locally, and "Native verified" fails until a maintainer attests that run for the head commit.
on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  js:
    name: JavaScript, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install
        run: |
          corepack enable
          yarn install --immutable
      - name: Lint, types, unit tests, checker self-tests, build, package contents, API surface, parity, README snippets, version pins and tree
        run: scripts/verify.sh lint typecheck test build pack api parity snippets pins tree

  shell-scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: bash -n, shellcheck and the tooling self-test
        run: scripts/verify.sh shell

  # Testing Ready counts a skipped job as a pass. So this job fails until the person who added the label
  # native-verified-locally comments "native-verified-locally <full sha>" for the pull request's head commit, after
  # running scripts/verify.sh on a Mac.
  native-verified:
    name: Native verified
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the native-verified-locally label and an attestation of the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: scripts/verified-label.sh

  # The required check: it fails unless every job above succeeded or was skipped.
  testing-ready:
    name: Testing Ready
    if: always()
    needs: [js, shell-scripts, native-verified]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job above succeeded or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a job this check needs ended with $result"; exit 1 ;;
            esac
          done
          echo "every job succeeded or was skipped: $RESULTS"
